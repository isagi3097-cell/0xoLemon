name: Release 0xoLemon

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build signed Windows release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup pinned Lua SteamKit SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '8.0.420'

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Validate tag matches application version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".TrimStart("v")
          $config = Get-Content -Raw -Encoding utf8 src-tauri/tauri.conf.json | ConvertFrom-Json
          if ($config.version -ne $tagVersion) {
            throw "Tag version $tagVersion does not match tauri.conf.json version $($config.version)"
          }

      - name: Create HuggingFace config from secret
        shell: pwsh
        env:
          HF_REPOS_JSON: ${{ secrets.HF_REPOS_JSON }}
        run: |
          if (-not $env:HF_REPOS_JSON) {
            throw "Secret HF_REPOS_JSON is not set. Please add it in GitHub repo Settings → Secrets and variables → Actions."
          }
          $env:HF_REPOS_JSON | Out-File -Encoding utf8 -NoNewline "src-tauri/huggingface-repos.json"
          Write-Host "HuggingFace config written from secret."

      - name: Verify HuggingFace config is present
        shell: pwsh
        run: |
          $cfg = Get-Content -Raw "src-tauri/huggingface-repos.json" | ConvertFrom-Json
          $count = ($cfg.repositories | Where-Object { $_.enabled }).Count
          Write-Host "HuggingFace repos configured: $count"
          if ($count -eq 0) {
            Write-Warning "No enabled HuggingFace repositories found in huggingface-repos.json"
          }

      - name: Download native Steam hook release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $repo = "isagi3097-cell/0xoLemon-plugin"
          $headers = @{
            Accept = "application/vnd.github+json"
            "User-Agent" = "0xoLemon-launcher-release"
            Authorization = "Bearer $env:GITHUB_TOKEN"
          }
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases/latest" -Headers $headers
          $asset = @($release.assets | Where-Object { $_.name -like "0xoLemon-plugin-*.7z" }) | Select-Object -First 1
          if (-not $asset) {
            throw "No 0xoLemon-plugin-*.7z asset found in latest plugin release $($release.tag_name)"
          }

          $archive = Join-Path $env:RUNNER_TEMP $asset.name
          Invoke-WebRequest -Uri $asset.browser_download_url -Headers $headers -OutFile $archive
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {
            throw "Plugin archive download failed: $archive"
          }

          $extract = Join-Path $env:RUNNER_TEMP "0xoLemon-plugin-extracted"
          if (Test-Path -LiteralPath $extract) {
            Remove-Item -LiteralPath $extract -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $extract | Out-Null

          $sevenZip = (Get-Command 7z.exe -ErrorAction SilentlyContinue).Source
          if (-not $sevenZip) {
            $sevenZip = Join-Path ${env:ProgramFiles} "7-Zip/7z.exe"
          }
          if (-not (Test-Path -LiteralPath $sevenZip -PathType Leaf)) {
            throw "7-Zip was not found on the GitHub runner"
          }
          & $sevenZip x $archive "-o$extract" -y
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to extract plugin archive $($asset.name)"
          }

          "PLUGIN_EXTRACT_DIR=$extract" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Downloaded plugin release $($release.tag_name): $($asset.name)"

      - name: Stage native Steam hook resources
        shell: pwsh
        run: |
          $source = $env:PLUGIN_EXTRACT_DIR
          $destination = Join-Path $PWD "src-tauri/resources/steam_hooks"
          $required = @("0xoCore.dll", "0xoPayload.dll", "dwmapi.dll", "xinput1_4.dll")
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          foreach ($name in $required) {
            $path = Join-Path $source $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Native Steam hook resource is missing: $path"
            }
            Copy-Item -LiteralPath $path -Destination (Join-Path $destination $name) -Force
          }
          Write-Host "Staged native Steam hook resources: $($required -join ', ')"

      - name: Stage bundled DepotDownloaderMod
        shell: pwsh
        run: |
          $src  = Join-Path $env:RUNNER_TEMP "ddmod-src"
          git clone --depth 1 https://github.com/SteamAutoCracks/DepotDownloaderMod.git $src
          if ($LASTEXITCODE -ne 0) { throw "git clone DepotDownloaderMod failed" }
          $proj = Join-Path $src "DepotDownloader/DepotDownloaderMod.csproj"
          $out  = Join-Path $env:RUNNER_TEMP "ddmod-publish"
          dotnet publish $proj -c Release --self-contained true -r win-x64 -o $out /p:PublishSingleFile=true /p:ApplicationIcon="" /p:TreatWarningsAsErrors=false
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed with exit code $LASTEXITCODE" }
          $exe  = Join-Path $out "DepotDownloaderMod.exe"
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "DepotDownloaderMod.exe not found in publish output: $out"
          }
          $dest = Join-Path $PWD "src-tauri/binaries/DepotDownloaderMod-x86_64-pc-windows-msvc.exe"
          New-Item -ItemType Directory -Force (Split-Path $dest) | Out-Null
          Copy-Item $exe $dest -Force
          $size = (Get-Item $dest).Length
          if ($size -lt 10MB) { throw "Published binary is unexpectedly small: $size bytes" }
          Write-Host "Staged self-contained DepotDownloaderMod: $dest ($size bytes)"



      - name: Validate release resource inputs
        shell: pwsh
        run: |
          $resourceRoot = Join-Path $PWD "src-tauri/resources"
          $requiredRoots = @(
            "emu", "gse-uc", "lightning", "managed-runtime", "tools"
          )
          foreach ($root in $requiredRoots) {
            $path = Join-Path $resourceRoot $root
            if (-not (Test-Path -LiteralPath $path -PathType Container)) {
              throw "Required resource root is missing: $path"
            }
            $files = @(Get-ChildItem -LiteralPath $path -Recurse -File)
            if ($files.Count -eq 0) {
              throw "Required resource root is empty: $path"
            }
            Write-Host ("Validated {0}: {1} files" -f $root, $files.Count)
          }

          $binary = Join-Path $PWD "src-tauri/binaries/DepotDownloaderMod-x86_64-pc-windows-msvc.exe"
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) {
            throw "Required bundled binary is missing: $binary"
          }
          Write-Host "Validated bundled binary: $binary"

      - name: Build, sign, and publish release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          OXO_DISCORD_CLIENT_ID: ${{ vars.OXO_DISCORD_CLIENT_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '0xoLemon ${{ github.ref_name }}'
          releaseBody: |
            0xoLemon v2.0.69

            - Uses the published 0xoLemon plugin package instead of compiling native hooks in launcher CI.
            - Validates and stages all four required hook DLLs before the Tauri build.

            The release includes the Windows installer and `latest.json` manifest used by the in-app updater.
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
          retryAttempts: 3
          args: --target x86_64-pc-windows-msvc

      - name: Verify packaged DepotDownloaderMod
        shell: pwsh
        run: |
          $matches = @(Get-ChildItem -Path "$PWD/src-tauri/target" -Recurse -File -Filter "DepotDownloaderMod-x86_64-pc-windows-msvc.exe" -ErrorAction SilentlyContinue)
          if ($matches.Count -eq 0) {
            throw "DepotDownloaderMod-x86_64-pc-windows-msvc.exe is absent from the packaged target output"
          }
          foreach ($match in $matches) {
            if ($match.Length -lt 10MB) {
              throw "Packaged DepotDownloaderMod is unexpectedly small: $($match.FullName) ($($match.Length) bytes)"
            }
            Write-Host "Packaged DepotDownloaderMod verified: $($match.FullName) ($($match.Length) bytes)"
          }

      - name: Verify packaged resource payload
        shell: pwsh
        run: |
          $candidates = @(Get-ChildItem -Path "$PWD/src-tauri/target" -Directory -Recurse -Filter resources -ErrorAction SilentlyContinue)
          $resourceDir = $null
          foreach ($c in $candidates) {
            $hasGse    = Test-Path (Join-Path $c.FullName "gse-uc") -PathType Container
            $hasRedist = Test-Path (Join-Path $c.FullName "redist") -PathType Container
            $hasTools  = Test-Path (Join-Path $c.FullName "tools")  -PathType Container
            if ($hasGse -and $hasRedist -and $hasTools) { $resourceDir = $c }
          }
          if (-not $resourceDir) {
            throw "Packaged resource directory was not found under src-tauri/target"
          }
          $files = @(Get-ChildItem -LiteralPath $resourceDir.FullName -Recurse -File | Where-Object {
            $_.FullName -notmatch '\\gse_tools\\generate_emu_config\\(_OUTPUT|out\.log)(\\|$)'
          })
          $bytes = [int64](($files | Measure-Object -Property Length -Sum).Sum)
          Write-Host "Packaged resources validated: $($files.Count) files, $bytes bytes at $($resourceDir.FullName)"


  build-android:
    name: Build Android APK
    needs: build-windows
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor
        working-directory: mobile-apk
        run: |
          npm ci
          npx cap sync android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android APK
        working-directory: mobile-apk/android
        run: ./gradlew assembleRelease

      - name: Upload APK Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: mobile-apk/android/app/build/outputs/apk/release/app-release-unsigned.apk
